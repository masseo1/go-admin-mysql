apiVersion: v1
kind: Secret
metadata:
  name: mysql-admin-secret
  namespace: mysql-admin
type: Opaque
stringData:
  # UI login credentials
  ADMIN_USER: "admin"
  ADMIN_PASS: "CHANGE_ME_STRONG_PASSWORD"
  # Must be exactly 32+ characters — used for AES-256 encryption of stored MySQL passwords
  ENCRYPTION_KEY: "CHANGE_ME_32_CHAR_RANDOM_SECRET_KEY"
